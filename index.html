<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuelo</title>
<style>
  :root { --ink: #15171a; --mute: #5c6168; --line: #e1dfd5; --bg: #fafaf7; --accent: #2a7253; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  h3 { font-size: 1rem; margin: 20px 0 4px; }
  p, li { margin: 6px 0; }
  ul { padding-left: 20px; }
  .meta { color: var(--mute); font-size: 0.9rem; margin: 0 0 16px; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { text-align: left; vertical-align: top; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--mute); font-weight: 600; }
  @media (max-width: 520px) { table, thead, tbody, tr, th, td { display: block; } thead { display: none; } td { border: none; padding: 2px 0; } tr { border-bottom: 1px solid var(--line); padding: 8px 0; } td::before { content: attr(data-label) ": "; color: var(--mute); font-weight: 600; } }
</style>
</head>
<body>
<main>
<h1>Fuelo</h1>
<p>Fuelo te ayuda a encontrar la gasolina más barata cerca de ti y en tu ruta, en España, Andorra y Francia. Es una app de AGILITZA, SLU.</p>
<ul>
<li><a href="privacidad/">Política de privacidad</a> · <a href="privacy/">Privacy policy</a></li>
<li><a href="terminos/">Condiciones de uso</a> · <a href="terms/">Terms of use</a></li>
</ul>
<p>Contacto: <a href="mailto:fuelo@agilitza.com">fuelo@agilitza.com</a></p>
</main>
</body>
</html>
